[project]
name = "smart-support-desk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# Installable package so `ml` (and later `app`) import from any working
# directory; required for unpickling the saved pipeline, which references
# ml.text.normalize. `uv sync` installs it in editable mode.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
