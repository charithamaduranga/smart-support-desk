[project]
name = "smart-support-desk"
version = "0.1.0"
description = "Support ticket web app with an ML category classifier and FAQ-grounded replies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "huggingface-hub>=2.4.0",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "openai>=3.59.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

# Installable package so `ml` and `app` import from any working directory;
# required for unpickling the saved pipeline, which references
# ml.text.normalize. `uv sync` installs it in editable mode.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
