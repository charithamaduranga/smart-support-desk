<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Support Desk{% endblock %}</title>
  <link rel="icon" href="data:,">{# no favicon; avoids a 404 on every page load #}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">Smart Support Desk</a>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" href="/">Contact support</a>
        <a class="btn btn-outline-light btn-sm" href="/team/tickets">Team</a>
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
