{% extends "base.html" %}
{% block title %}New ticket · Smart Support Desk{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New support ticket</h1>
{% if error %}
  <div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}
<form method="post" action="/tickets" class="card card-body">
  <label for="message" class="form-label">Describe your issue</label>
  <textarea id="message" name="message" class="form-control mb-2" rows="6"
            maxlength="{{ max_length }}" required>{{ message }}</textarea>
  <div class="form-text mb-3">Up to {{ max_length }} characters. The category is predicted automatically.</div>
  <div><button type="submit" class="btn btn-primary">Submit ticket</button></div>
</form>
{% endblock %}
